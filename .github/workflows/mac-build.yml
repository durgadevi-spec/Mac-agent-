name: Build macOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_mac:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for build
        env:
          TIMESHEET_DB_URL: ${{ secrets.TIMESHEET_DB_URL }}
          LMS_DATABASE_URL: ${{ secrets.LMS_DATABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          printf 'PORT=5003\n' > .env
          printf 'TIMESHEET_DB_URL=%s\n' "$TIMESHEET_DB_URL" >> .env
          printf 'LMS_DATABASE_URL=%s\n' "$LMS_DATABASE_URL" >> .env
          printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL" >> .env
          printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY" >> .env

      - name: Build macOS App
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knockturn-Mac-App
          path: release/*.dmg
          retention-days: 7
