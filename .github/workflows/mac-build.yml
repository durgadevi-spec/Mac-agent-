name: Build macOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_mac:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test macOS window detection script
        run: |
          npm run test:macos-window
          node --input-type=module -e 'import fs from "node:fs"; import { MACOS_WINDOW_DETECTION_SCRIPT } from "./dist/electron/macosWindowDetection.js"; fs.writeFileSync(`${process.env.RUNNER_TEMP}/getActiveWindow.applescript`, MACOS_WINDOW_DETECTION_SCRIPT);'
          osacompile -o "$RUNNER_TEMP/getActiveWindow.scpt" "$RUNNER_TEMP/getActiveWindow.applescript"

      - name: Create .env file for build
        env:
          TIMESHEET_DB_URL: ${{ secrets.TIMESHEET_DB_URL }}
          LMS_DATABASE_URL: ${{ secrets.LMS_DATABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$TIMESHEET_DB_URL" || { echo "Missing GitHub secret: TIMESHEET_DB_URL"; exit 1; }
          test -n "$LMS_DATABASE_URL" || { echo "Missing GitHub secret: LMS_DATABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "Missing GitHub secret: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing GitHub secret: VITE_SUPABASE_ANON_KEY"; exit 1; }
          printf 'PORT=5003\n' > .env
          printf 'TIMESHEET_DB_URL=%s\n' "$TIMESHEET_DB_URL" >> .env
          printf 'LMS_DATABASE_URL=%s\n' "$LMS_DATABASE_URL" >> .env
          printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL" >> .env
          printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY" >> .env

      - name: Build macOS App
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Sign macOS DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERTIFICATE_PATH="$RUNNER_TEMP/apple_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          DMG_PATH=$(ls release/*.dmg | head -n 1)
          echo "Signing DMG: $DMG_PATH"
          codesign --force --deep --sign "Apple Distribution" --options runtime --timestamp "$DMG_PATH"

      - name: Notarize macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          DMG_PATH=$(ls release/*.dmg | head -n 1)
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knockturn-Mac-App
          path: release/*.dmg
          retention-days: 7
